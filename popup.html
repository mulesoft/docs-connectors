<!DOCTYPE html>
<html>
<head>
  <title>Simple Chrome Extension</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px 0;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h2>Simple Chrome Extension</h2>
  <button id="changeColor">Change Page Color</button>
  <script src="popup.js"></script>
</body>
</html>
